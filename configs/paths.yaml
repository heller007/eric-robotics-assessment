# Committed defaults, identical on every machine. Per-machine paths belong in
# configs/local.yaml, which is git-ignored and layered on top of this file -
# data.fetch_nuscenes and data.fetch_dataset write it for you.

# ------------------------------------------------------------- raw sources
# Folder that directly contains  v1.0-mini/  samples/  sweeps/  maps/
# Leave null and run:  python -m data.fetch_nuscenes
nuscenes_root: null
nuscenes_dest: datasets/nuscenes      # where fetch_nuscenes extracts to

# Folder that contains  annotations/  train2017/  val2017/  (optional: when null
# and download_coco is true, only the ~2,000 stop-sign images are fetched)
coco_root: null
download_coco: true

# Scenes held out as val. Not the devkit's mini_val, which has no barriers at
# all. Two constraints fight here: every class must appear in val, and training
# must see each class in more than one scene. Barriers live in only two
# substantial scenes (989 in scene-0061, 584 in scene-0553), so holding out the
# larger one leaves the model with barriers from a single scene - it then scores
# ~0 on anything else, which is exactly what happened. Holding out the smallest
# scene that still has a usable count keeps both big scenes in training.
# Val is small as a result (43 cones, 47 barriers); that is the trade, and the
# Task 1 notebook recomputes it from the data rather than trusting these names.
val_scenes: [scene-0655, scene-0553]

# ------------------------------------------------------------ Task 1 output
# The merged 3-class YOLO dataset that everything downstream reads.
out_root: datasets/yolo_3class

# A prepared copy published as a Kaggle dataset, used instead of rebuilding.
# Disabled: the published version is still awaiting compression on Kaggle and
# cannot be downloaded, so the local build is the live path. Put the slug back
# once it is ready and data.fetch_dataset will pick it up again.
dataset_root: null
kaggle_dataset: null
# kaggle_dataset: pandeyvineet/eric-cones-stops-barriers

# ------------------------------------------------------------------- outputs
runs_root: runs
